<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salón Aurora — Iniciar sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="app-body">

  <div class="app-shell">

    <aside class="sidebar">

      <div class="sidebar__top">
        <a class="sidebar__mark" href="inicio.html">Salón Aurora <small>EVENTOS</small></a>
      </div>

      <nav class="sidebar__nav" aria-label="Navegación principal">
        <a class="sidebar__link" href="inicio.html">Inicio</a>
        <a class="sidebar__link" href="instructivo.html">Cómo reservar</a>
        <a class="sidebar__link" href="calendario.html">Disponibilidad</a>
        <div class="sidebar__session">
          <a class="sidebar__link is-active" id="loginLink" href="login.html">Iniciar sesión</a>
          <a class="sidebar__link" id="registerLink" href="registro.html">Crear cuenta</a>
          <div class="sidebar__user" id="userSection" hidden>
            <span class="sidebar__username" id="userName"></span>
            <a class="sidebar__link" href="perfil.html">Mis eventos</a>
            <button class="sidebar__logout" type="button" onclick="logout()">Cerrar sesión</button>
          </div>
        </div>
      </nav>

    </aside>

    <main class="main">

      <section class="auth">

        <div class="auth__card">

          <p class="intro__eyebrow">
            Reservaciones del salón
          </p>

          <h1 class="auth__title">
            Iniciar sesión
          </h1>

          <p class="auth__description">
            Ingresa con tu cuenta para solicitar fechas para tus celebraciones.
          </p>

          <form class="auth__form" id="loginForm">

            <div class="field">
              <label for="email">
                Correo electrónico
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="usuario@correo.com"
                required
              >
            </div>

            <div class="field">
              <label for="password">
                Contraseña
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
              >
            </div>

            <button class="btn btn--primary" type="submit">
              Iniciar sesión
            </button>

          </form>

          <p class="auth__footer">
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
          </p>

        </div>

      </section>

    </main>

  </div>

  <script src="js/login.js"></script>
  <script src="js/session.js"></script>
  
</body>
</html>
