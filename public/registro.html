<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salón Aurora — Registro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="app-body">

  <div class="app-shell">

    <aside class="sidebar">

      <div class="sidebar__top">
        <span class="sidebar__mark">Salón Aurora <small>EVENTOS</small></span>
      </div>

      <nav class="sidebar__nav">
        <a class="sidebar__link" href="inicio.html">Inicio</a>
        <a class="sidebar__link" href="instructivo.html">Cómo reservar</a>
        <a class="sidebar__link" href="calendario.html">Disponibilidad</a>
        <a
          class="sidebar__link"
          id="loginLink"
          href="login.html"
        >
        Iniciar sesión
        </a>

        <a
          class="sidebar__link is-active"
          id="registerLink"
          href="registro.html"
          >
          Crear cuenta
        </a>

        <div
          class="sidebar__user"
          id="userSection"
          style="display: none;"
        >
      <span
        class="sidebar__username"
        id="userName"
      >
      Usuario
    </span>

    <button
      class="sidebar__logout"
      type="button"
      onclick="logout()"
    >
      Cerrar sesión
    </button>
  </div>
      </nav>

    </aside>

    <main class="main">

      <section class="auth">

        <div class="auth__card">

          <p class="intro__eyebrow">
            Reservaciones del salón
          </p>

          <h1 class="auth__title">
            Crear cuenta
          </h1>

          <p class="auth__description">
            Regístrate para poder crear y solicitar fechas para tus celebraciones.
          </p>

          <form class="auth__form" id="registroForm">

            <div class="field">
              <label for="nombre">
                Nombre
              </label>

              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
              >
            </div>

            <div class="field">
              <label for="email">
                Correo electrónico
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="usuario@correo.com"
                required
              >
            </div>

            <div class="field">
              <label for="password">
                Contraseña
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                minlength="8"
                required
              >
            </div>

            <div class="field">
              <label for="confirmPassword">
                Confirmar contraseña
              </label>

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repite tu contraseña"
                minlength="8"
                required
              >
            </div>

            <button class="btn btn--primary" type="submit">
              Crear cuenta
            </button>

          </form>

          <p class="auth__footer">
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
          </p>

        </div>

      </section>

    </main>

  </div>

  <script src="js/registro.js"></script>
  <script src="js/session.js"></script>

</body>
</html>
